<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Madsplat Admin | Studio Control</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <nav>
      <div class="nav-container">
        <div class="branding">
          <img src="../logo.png" alt="Madsplat" class="nav-logo" />
          <span class="brand-name">Madsplat Admin</span>
        </div>
        <div class="hamburger" id="hamburger">
          <span class="bar"></span><span class="bar"></span
          ><span class="bar"></span>
        </div>
        <div class="nav-menu" id="nav-menu">
          <a href="../index.html" class="nav-item">View Gallery</a>
          <button id="theme-toggle" class="theme-btn">Theme</button>
        </div>
      </div>
    </nav>

    <main class="panel">
      <div id="login-form">
        <h2 style="font-family: var(--font-heading)">Admin Login</h2>
        <input type="text" id="user" placeholder="Username" />
        <input type="password" id="pass" placeholder="Password" />
        <button onclick="login()">Login</button>
      </div>

      <div id="dashboard" style="display: none">
        <h2 style="font-family: var(--font-heading)">Studio Control</h2>
        <div style="background: var(--divider); padding: 20px; margin: 20px 0">
          <small>Wallet Balance</small>
          <h1 id="balance" style="margin: 0; color: var(--cta)">KES 0</h1>
        </div>
        <input type="number" id="amount" placeholder="KES Amount" />
        <button onclick="processIntaSend('DEPOSIT')">Deposit</button>
        <button
          onclick="processIntaSend('WITHDRAW')"
          style="background: var(--accent-alt)"
        >
          Withdraw
        </button>
        <h3 style="margin-top: 2rem; border-bottom: 1px solid var(--divider)">
          Transaction History
        </h3>
        <ul id="history" style="padding: 0"></ul>
      </div>
    </main>

    <script src="../js/theme.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
