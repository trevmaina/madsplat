<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Madsplat Admin | Studio Control</title>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../assets/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../assets/favicon-16x16.png"
    />
    <link rel="manifest" href="../assets/site.webmanifest" />
    <link rel="stylesheet" href="../css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Protest+Revolution&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav>
      <div class="nav-container">
        <div class="branding">
          <img src="../assets/logo.png" alt="Madsplat Logo" class="nav-logo" />
          <span class="brand-name">Madsplat Admin</span>
        </div>
        <div class="hamburger" id="hamburger">
          <span class="bar"></span><span class="bar"></span
          ><span class="bar"></span>
        </div>
        <div class="nav-menu" id="nav-menu">
          <a href="../index.html" class="nav-item">View Gallery</a>
          <button class="nav-item admin-tab" data-target="dashboard">
            Transaction History
          </button>
          <button class="nav-item admin-tab" data-target="account">
            Account
          </button>
          <button id="theme-toggle" class="theme-btn">✦ Theme</button>
          <button
            class="nav-item"
            onclick="logout()"
            style="color: var(--accent-alt)"
          >
            Log-out
          </button>
        </div>
      </div>
    </nav>

    <main class="panel">
      <div id="login-form">
        <h2 style="font-family: var(--font-heading)">Admin Login</h2>
        <input type="text" id="user" placeholder="Username" />
        <input type="password" id="pass" placeholder="Password" />
        <button onclick="login()">Login</button>
      </div>

      <div id="admin-content" style="display: none">
        <section id="dashboard" class="tab-content">
          <h2 style="font-family: var(--font-heading)">Studio Control</h2>

          <div
            style="
              background: var(--divider);
              padding: 20px;
              margin: 20px 0;
              border-left: 3px solid var(--cta);
            "
          >
            <small>Paystack Wallet Transfer (KES)</small>
            <h1 id="balance" style="margin: 0; color: var(--cta)">KES 0</h1>
          </div>

          <div style="margin-bottom: 15px">
            <input
              type="number"
              id="admin-deposit-amount"
              placeholder="Enter Amount in KES"
            />
          </div>

          <button onclick="adminDeposit()">Deposit via Paystack</button>

          <h3 style="margin-top: 2rem; border-bottom: 1px solid var(--divider)">
            Activity Feed
          </h3>
          <ul id="history" style="padding: 0"></ul>
        </section>

        <section id="account" class="tab-content" style="display: none">
          <h2 style="font-family: var(--font-heading)">Account Settings</h2>
          <div
            style="
              background: var(--divider);
              padding: 20px;
              margin-top: 20px;
              border-left: 3px solid var(--accent-blue);
            "
          >
            <p
              style="
                margin: 0 0 10px 0;
                font-size: 0.8rem;
                color: var(--text-sub);
              "
            >
              Studio Identity
            </p>
            <div style="display: grid; gap: 15px">
              <div>
                <label style="font-size: 0.7rem; text-transform: uppercase"
                  >Studio Name</label
                >
                <input
                  type="text"
                  id="studio-name"
                  value="Madsplat Urban Studio"
                  style="margin-top: 5px"
                />
              </div>
              <div>
                <label style="font-size: 0.7rem; text-transform: uppercase"
                  >Payout Email (Paystack)</label
                >
                <input
                  type="email"
                  id="studio-email"
                  value="admin@madsplat.com"
                  style="margin-top: 5px"
                />
              </div>
              <button
                onclick="saveAccountSettings()"
                style="
                  width: auto;
                  padding: 10px 25px;
                  background: var(--accent-blue);
                "
              >
                Save Settings
              </button>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script src="../js/theme.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
