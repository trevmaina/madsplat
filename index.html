<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Madsplat | Art</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav>
      <div class="nav-container">
        <div class="branding">
          <img src="logo.png" alt="Madsplat" class="nav-logo" />
          <span class="brand-name">Madsplat</span>
        </div>

        <div class="hamburger" id="hamburger">
          <span class="bar"></span><span class="bar"></span
          ><span class="bar"></span>
        </div>

        <div class="nav-menu" id="nav-menu">
          <a href="index.html" class="nav-item">All Works</a>
          <button
            class="nav-item nav-cat"
            data-cat="Paintings"
            style="background: none; cursor: pointer"
          >
            Paintings
          </button>
          <button
            class="nav-item nav-cat"
            data-cat="Digital Art"
            style="background: none; cursor: pointer"
          >
            Digital Art
          </button>
          <button
            class="nav-item nav-cat"
            data-cat="Oil Pastel"
            style="background: none; cursor: pointer"
          >
            Oil Pastel
          </button>
          <button id="theme-toggle" class="theme-btn">✦ Theme</button>
        </div>
      </div>
    </nav>

    <header style="padding: 3rem 5% 0 5%">
      <h2
        style="
          font-family: var(--font-heading);
          text-transform: uppercase;
          font-size: 2.5rem;
          margin: 0;
        "
      >
        Collections
      </h2>

      <div
        class="tab-bar"
        style="
          display: flex;
          gap: 20px;
          margin-top: 2rem;
          border-bottom: 1px solid var(--divider);
          overflow-x: auto;
          padding-bottom: 10px;
        "
      >
        <button
          class="tab-btn active"
          onclick="renderGallery('All')"
          style="
            width: auto;
            background: none;
            color: inherit;
            border-bottom: 2px solid var(--accent-blue);
          "
        >
          All Works
        </button>
        <button
          class="tab-btn"
          onclick="renderGallery('Paintings')"
          style="width: auto; background: none; color: inherit"
        >
          Paintings
        </button>
        <button
          class="tab-btn"
          onclick="renderGallery('Digital Art')"
          style="width: auto; background: none; color: inherit"
        >
          Digital Art
        </button>
        <button
          class="tab-btn"
          onclick="renderGallery('Oil Pastel')"
          style="width: auto; background: none; color: inherit"
        >
          Oil Pastel
        </button>
      </div>
    </header>

    <main id="gallery-grid" class="grid-container"></main>

    <script src="js/theme.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
