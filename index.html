<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Madsplat | Art</title>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/favicon-16x16.png"
    />
    <link rel="manifest" href="assets/site.webmanifest" />
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Protest+Revolution&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav>
      <div class="nav-container">
        <div class="branding">
          <img src="assets/logo.png" alt="Madsplat Logo" class="nav-logo" />
          <span class="brand-name">Madsplat</span>
        </div>

        <div class="hamburger" id="hamburger">
          <span class="bar"></span><span class="bar"></span
          ><span class="bar"></span>
        </div>

        <div class="nav-menu" id="nav-menu">
          <a href="index.html" class="nav-item">All Works</a>
          <button
            class="nav-item nav-cat"
            data-cat="Paintings"
            style="background: none; cursor: pointer"
          >
            Paintings
          </button>
          <button
            class="nav-item nav-cat"
            data-cat="Digital Art"
            style="background: none; cursor: pointer"
          >
            Digital Art
          </button>
          <button
            class="nav-item nav-cat"
            data-cat="Oil Pastel"
            style="background: none; cursor: pointer"
          >
            Oil Pastel
          </button>
          <button id="theme-toggle" class="theme-btn">✦ Theme</button>
        </div>
      </div>
    </nav>

    <header style="padding: 3rem 5% 0 5%">
      <h2
        style="
          font-family: var(--font-heading);
          text-transform: uppercase;
          font-size: 2.5rem;
          margin: 0;
        "
      >
        Collections
      </h2>

      <div
        class="tab-bar"
        style="
          display: flex;
          gap: 20px;
          margin-top: 2rem;
          border-bottom: 1px solid var(--divider);
          overflow-x: auto;
          padding-bottom: 10px;
        "
      >
        <button
          class="tab-btn active"
          onclick="renderGallery('All')"
          style="
            width: auto;
            background: none;
            color: inherit;
            border-bottom: 2px solid var(--accent-blue);
          "
        >
          All Works
        </button>
        <button
          class="tab-btn"
          onclick="renderGallery('Paintings')"
          style="width: auto; background: none; color: inherit"
        >
          Paintings
        </button>
        <button
          class="tab-btn"
          onclick="renderGallery('Digital Art')"
          style="width: auto; background: none; color: inherit"
        >
          Digital Art
        </button>
        <button
          class="tab-btn"
          onclick="renderGallery('Oil Pastel')"
          style="width: auto; background: none; color: inherit"
        >
          Oil Pastel
        </button>
      </div>
    </header>

    <main id="gallery-grid" class="grid-container"></main>

    <footer>
      <div class="footer-container">
        <div class="footer-top">
          <div class="footer-brand">
            <img src="assets/logo2.png" alt="Madsplat" class="footer-logo" />
            <span class="brand-name">Madsplat</span>
            <p>Art Studio & Digital Gallery based in Nairobi, Kenya.</p>
          </div>
          <div class="footer-links">
            <h4>Explore</h4>
            <a href="index.html">Gallery</a>
            <a href="index.html?filter=Paintings">Paintings</a>
            <a href="index.html?filter=Digital%20Art">Digital Art</a>
          </div>
          <div class="footer-links">
            <h4>Reach Out Via</h4>
            <a href="tel:+254718009811" target="_blank"
              ><i class="fa-solid fa-phone"></i> Telephone</a
            >
            <a href="mailto:trevomaina@gmail.com" target="_blank"
              ><i class="fa-solid fa-envelope"></i> Email</a
            >
            <a href="https://instagram.com/madsplat_" target="_blank"
              ><i class="fa-brands fa-instagram"></i> Instagram</a
            >
            <a
              href="https://wa.me/254718009811?text=Hi%20Madsplat,%20I'm%20interested%20in%20an%20artwork."
              target="_blank"
              ><i class="fa-brands fa-whatsapp"></i> Whatsapp</a
            >
          </div>
        </div>
        <div class="footer-bottom">
          <p>
            &copy; <span id="current-year"></span> Madsplat. All rights
            reserved.
          </p>
          <div class="footer-secure">
            <span>Splash your style</span>
          </div>
        </div>
      </div>
    </footer>
    <script src="js/theme.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
