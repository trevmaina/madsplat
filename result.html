<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Madsplat | Transaction Status</title>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/favicon-16x16.png"
    />
    <link rel="manifest" href="assets/site.webmanifest" />
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Protest+Revolution&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav>
      <div class="nav-container">
        <div class="branding">
          <img src="assets/logo.png" alt="Madsplat Logo" class="nav-logo" />
          <span class="brand-name">Madsplat</span>
        </div>
        <div class="hamburger" id="hamburger">
          <span class="bar"></span><span class="bar"></span
          ><span class="bar"></span>
        </div>
        <div class="nav-menu" id="nav-menu">
          <a href="index.html" class="nav-item">View Gallery</a>
          <button id="theme-toggle" class="theme-btn">✦ Theme</button>
        </div>
      </div>
    </nav>

    <main class="panel" style="text-align: center; margin-top: 5rem">
      <div
        id="status-icon"
        style="font-size: 5rem; margin-bottom: 1.5rem"
      ></div>
      <h2
        id="status-title"
        style="
          font-family: var(--font-heading);
          text-transform: uppercase;
          font-size: 2rem;
        "
      ></h2>
      <p
        id="status-msg"
        style="
          color: var(--text-sub);
          margin-bottom: 2.5rem;
          max-width: 400px;
          margin-left: auto;
          margin-right: auto;
        "
      ></p>

      <div
        id="tx-details"
        style="
          display: none;
          background: var(--divider);
          padding: 20px;
          margin-bottom: 2rem;
          border: 1px solid var(--accent-blue);
        "
      >
        <small
          style="
            display: block;
            text-transform: uppercase;
            color: var(--accent-blue);
            margin-bottom: 5px;
            font-size: 0.7rem;
          "
          >Tracking ID</small
        >
        <strong
          id="ref-id"
          style="font-family: monospace; font-size: 1.1rem"
        ></strong>
      </div>

      <button
        onclick="window.location.href='index.html'"
        style="max-width: 250px"
      >
        Return to Gallery
      </button>
    </main>

    <footer>
      <div class="footer-container">
        <div class="footer-top">
          <div class="footer-brand">
            <img src="assets/logo2.png" alt="Madsplat" class="footer-logo" />
            <span class="brand-name">Madsplat</span>
            <p>Art Studio & Digital Gallery based in Nairobi, Kenya.</p>
          </div>
          <div class="footer-links">
            <h4>Explore</h4>
            <a href="index.html">Gallery</a>
            <a href="index.html?filter=Paintings">Paintings</a>
            <a href="index.html?filter=Digital%20Art">Digital Art</a>
          </div>
          <div class="footer-links">
            <h4>Reach Out Via</h4>
            <a href="tel:+254718009811" target="_blank"
              ><i class="fa-solid fa-phone"></i> Telephone</a
            >
            <a href="mailto:trevomaina@gmail.com" target="_blank"
              ><i class="fa-solid fa-envelope"></i> Email</a
            >
            <a href="https://instagram.com/madsplat_" target="_blank"
              ><i class="fa-brands fa-instagram"></i> Instagram</a
            >
            <a href="https://wa.me/254718009811" target="_blank"
              ><i class="fa-brands fa-whatsapp"></i> Whatsapp</a
            >
          </div>
        </div>
        <div class="footer-bottom">
          <p>
            &copy; <span id="current-year"></span> Madsplat. All rights
            reserved.
          </p>
          <div class="footer-secure">
            <span>Splash your style</span>
          </div>
        </div>
      </div>
    </footer>

    <script src="js/theme.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);
        const status = params.get("status");

        // Paystack returns data in a different structure than IntaSend
        const lastTx = JSON.parse(localStorage.getItem("lastTx") || "{}");

        const title = document.getElementById("status-title");
        const msg = document.getElementById("status-msg");
        const icon = document.getElementById("status-icon");
        const refBox = document.getElementById("tx-details");
        const refId = document.getElementById("ref-id");

        if (status === "success") {
          icon.innerHTML = "✔";
          icon.style.color = "var(--cta)";
          title.innerText = "Payment Successful";
          msg.innerText =
            "The transaction was processed. Your artwork selection is now being prepared for you.";

          // PAYSTACK FIX: Look for 'reference' or 'trnx_ref' instead of 'tracking_id'
          const paystackRef = lastTx.reference || lastTx.trnx_ref || "N/A";

          if (paystackRef !== "N/A") {
            refBox.style.display = "block";
            refId.innerText = paystackRef;
          }
        } else {
          icon.innerHTML = "✘";
          icon.style.color = "var(--accent-alt)";
          title.innerText = "Payment Failed";
          msg.innerText =
            "We encountered an issue processing your payment. No funds were moved. Please try again or contact support.";
        }
      });
    </script>
  </body>
</html>
