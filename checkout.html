<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Madsplat | Checkout</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://unpkg.com/intasend-inlinejs-sdk@3.0.4/build/intasend-inline.js"></script>
  </head>
  <body>
    <nav>
      <div class="nav-container">
        <div class="branding">
          <img src="logo.png" alt="Madsplat" class="nav-logo" />
          <span class="brand-name">Madsplat</span>
        </div>

        <div class="hamburger" id="hamburger">
          <span class="bar"></span><span class="bar"></span
          ><span class="bar"></span>
        </div>

        <div class="nav-menu" id="nav-menu">
          <a href="index.html" class="nav-item">All Works</a>
          <button
            class="nav-item nav-cat"
            data-cat="Paintings"
            style="background: none; border: none; cursor: pointer"
          >
            Paintings
          </button>
          <button
            class="nav-item nav-cat"
            data-cat="Digital Art"
            style="background: none; border: none; cursor: pointer"
          >
            Digital Art
          </button>
          <button
            class="nav-item nav-cat"
            data-cat="Oil Pastel"
            style="background: none; border: none; cursor: pointer"
          >
            Oil Pastel
          </button>
          <button id="theme-toggle" class="theme-btn">Theme</button>
        </div>
      </div>
    </nav>

    <main class="panel">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 1.5rem;
        "
      >
        <h2 style="font-family: var(--font-heading); margin: 0">Checkout</h2>
        <a
          href="index.html"
          style="
            text-decoration: none;
            font-size: 0.8rem;
            color: var(--text-sub);
            border: 1px solid var(--divider);
            padding: 5px 10px;
          "
          >← Back</a
        >
      </div>

      <div
        id="order-summary"
        style="
          margin-bottom: 2rem;
          border-bottom: 1px solid var(--divider);
          padding-bottom: 1rem;
        "
      ></div>

      <h4
        style="
          text-transform: uppercase;
          font-size: 0.7rem;
          color: var(--accent-blue);
          margin-bottom: 10px;
        "
      >
        Contact Information
      </h4>
      <input type="text" id="cust-name" placeholder="Full Name" />
      <input type="email" id="cust-email" placeholder="Email Address" />
      <input type="text" id="cust-phone" placeholder="Phone (e.g. 254...)" />

      <h4
        style="
          text-transform: uppercase;
          font-size: 0.7rem;
          color: var(--accent-blue);
          margin-top: 1.5rem;
          margin-bottom: 10px;
        "
      >
        Payment Details (Secure)
      </h4>
      <input type="text" id="card-holder" placeholder="Name on Card" />
      <input
        type="text"
        id="card-num"
        placeholder="Card Number (XXXX XXXX XXXX XXXX)"
      />
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
        <input type="text" id="card-expiry" placeholder="MM/YY" />
        <input type="text" id="card-cvv" placeholder="CVV" />
      </div>

      <button id="pay-now-btn">Complete Purchase</button>
      <p
        style="
          font-size: 0.65rem;
          color: var(--text-sub);
          text-align: center;
          margin-top: 1rem;
        "
      >
        Payments secured by IntaSend. Your card data is never stored on madsplat
        servers.
      </p>
    </main>

    <script src="js/theme.js"></script>
    <script src="js/intasend.js"></script>
    <script src="js/app.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const art = JSON.parse(localStorage.getItem("selectedArtwork"));
        if (art) {
          document.getElementById("order-summary").innerHTML = `
                    <p style="margin: 5px 0;">Item: <strong>${
                      art.title
                    }</strong></p>
                    <p style="margin: 5px 0;">Total: <strong style="color:var(--accent-blue)">KES ${art.price.toLocaleString()}</strong></p>
                `;
        }

        document.getElementById("pay-now-btn").onclick = () => {
          const email = document.getElementById("cust-email").value;
          const phone = document.getElementById("cust-phone").value;

          if (!email || !phone) return alert("Please fill in contact details.");

          // IntaSend handles the payment logic
          IntaSendService.initiatePayment(art.price, email, phone);
        };
      });
    </script>
  </body>
</html>
